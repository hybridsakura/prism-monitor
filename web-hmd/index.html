<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism Monitor · HMD Console</title>
<style>
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --line: #e4e6eb;
  --line-subtle: #f0f2f5;
  --fg: #1f2328;
  --fg2: #6b7280;
  --blue: #2f6feb;
  --purple: #8b5cf6;
  --cyan: #0ea5e9;
  --red: #dc2626;
  --green: #16a34a;
  --orange: #ea8b1f;
  --amber: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* 一屏沉浸模式（Fit Screen）下的全局视口锁定 */
body.fit-screen {
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: 10px 20px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 10;
  flex-shrink: 0;
}
header h1 {
  font-size: 14.5px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
header h1 .logo {
  display: inline-block;
  width: 18px;
  height: 18px;
  vertical-align: middle;
}
header h1 #sub {
  color: var(--fg2);
  font-weight: 400;
  font-size: 11.5px;
}

.controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.ranges {
  display: flex;
  background: var(--bg);
  border-radius: 6px;
  padding: 2px;
  gap: 2px;
}
.ranges button {
  border: none;
  background: transparent;
  padding: 3px 8px;
  font-size: 11.5px;
  border-radius: 4px;
  cursor: pointer;
  color: var(--fg2);
  font-weight: 500;
  transition: all 0.15s;
}
.ranges button:hover { color: var(--fg); }
.ranges button.on {
  background: var(--card);
  color: var(--blue);
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  font-weight: 600;
}

.mode-btn {
  border: 1px solid var(--line);
  background: var(--card);
  padding: 3px 9px;
  font-size: 11.5px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--fg2);
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.mode-btn:hover { color: var(--fg); border-color: #cbd5e1; }
.mode-btn.active {
  background: #eff6ff;
  border-color: #bfdbfe;
  color: var(--blue);
  font-weight: 600;
}

.meta {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 11.5px;
  color: var(--fg2);
}
.dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  margin-right: 4px;
}
.dot.err { background: var(--red); }

main {
  width: 100%;
  padding: 12px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex: 1;
}

body.fit-screen main {
  height: calc(100vh - 51px);
  overflow: hidden;
  padding: 10px 16px;
  gap: 10px;
}

/* 顶部 6 张卡片 */
.cards {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  flex-shrink: 0;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 1px 2px rgba(0,0,0,0.02);
}
.card .k {
  font-size: 11px;
  color: var(--fg2);
  margin-bottom: 2px;
  font-weight: 500;
  display: flex;
  justify-content: space-between;
}
.card .v {
  font-size: 20px;
  font-weight: 600;
  color: var(--fg);
  font-family: ui-monospace, "SF Mono", "Segoe UI Mono", monospace;
  letter-spacing: -0.5px;
  line-height: 1.2;
}
.card .v small {
  font-size: 11px;
  font-weight: 500;
  margin-left: 2px;
  color: var(--fg2);
}
.card .s {
  font-size: 10.5px;
  color: var(--fg2);
  margin-top: 3px;
  font-family: ui-monospace, monospace;
}

/* 下方 8 块图表面板网格 */
.charts {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  flex: 1;
}

body.fit-screen .charts {
  height: 100%;
  min-height: 0;
}

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 14px 8px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 1px 2px rgba(0,0,0,0.02);
  min-height: 0;
}
.panel h2 {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-shrink: 0;
}
.panel h2 em {
  font-style: normal;
  font-weight: 400;
  font-size: 11px;
  color: var(--fg2);
}
.legend {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--fg2);
  margin-bottom: 4px;
  min-height: 16px;
  flex-wrap: wrap;
  flex-shrink: 0;
}
.legend span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.legend i {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 2px;
}
.legend b {
  font-weight: 600;
  color: var(--fg);
  font-family: ui-monospace, monospace;
}

.cvs {
  position: relative;
  flex: 1;
  width: 100%;
  min-height: 120px;
}
.cvs canvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
}

/* 响应式断点系统：充分释放带鱼屏 / 超宽屏 / 4K 空间 */
/* 超宽屏（>= 1800px，如 21:9 2560/3440/3840/5120）：自动 4 列 × 2 行，完美一屏！ */
@media (min-width: 1800px) {
  .charts {
    grid-template-columns: repeat(4, 1fr) !important;
    grid-template-rows: repeat(2, 1fr);
  }
}

/* 中宽屏（1300px ~ 1799px）：支持 2 列或在 fit-screen 采用 4 列紧凑 */
@media (min-width: 1400px) and (max-width: 1799px) {
  body.fit-screen .charts {
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
  }
}

@media (max-width: 1200px) {
  .cards { grid-template-columns: repeat(3, 1fr); }
  .charts { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 700px) {
  .cards { grid-template-columns: repeat(2, 1fr); }
  .charts { grid-template-columns: 1fr; }
  header { padding: 10px 14px; }
  main { padding: 10px 12px; }
}
</style>
</head>
<body class="fit-screen">
<header>
  <h1>
    <svg class="logo" viewBox="0 0 24 24" fill="none">
      <path d="M12 2L22 8.5L12 15L2 8.5L12 2Z" fill="#2f6feb"/>
      <path d="M2 8.5V15.5L12 22V15L2 8.5Z" fill="#1e40af"/>
      <path d="M22 8.5V15.5L12 22V15L22 8.5Z" fill="#172554"/>
    </svg>
    <span id="ttl">Prism Monitor</span>
    <span id="sub">主机监控</span>
  </h1>

  <div class="controls">
    <div class="ranges" id="ranges"></div>
    <button class="mode-btn active" id="fitScreenBtn" title="切换一屏固定与自由滚动布局">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
        <path d="M1.5 2A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-13zm0 1h13a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5z"/>
        <path d="M4 6.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708L5 7.707V9a.5.5 0 0 1-1 0V6.5zm8 3a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h1.293L8.646 6.854a.5.5 0 1 1 .708-.708L11 8.293V7a.5.5 0 0 1 1 0v2.5z"/>
      </svg>
      <span id="fitScreenLabel">一屏模式</span>
    </button>
  </div>

  <div class="meta">
    <span><span class="dot" id="dot"></span><span id="stateText">连接中...</span></span>
    <span class="live-pill" id="livePill" style="display:inline-block;padding:1px 6px;border-radius:4px;background:#dcfce7;color:#15803d;font-size:10px;font-weight:600;font-family:ui-monospace,monospace;">LIVE</span>
    <span id="updated">--</span>
  </div>
</header>

<main>
  <section class="cards" id="cards"></section>
  <section class="charts" id="charts"></section>
</main>

<script>
"use strict";

const RANGES = {
  "15m": 15 * 60,
  "1h": 3600,
  "6h": 6 * 3600,
  "24h": 24 * 3600,
  "7d": 7 * 86400,
  "30d": 30 * 86400
};
let currentRange = "1h";
let timer = null;
const state = {};

// 顶部 6 张卡片定义
const CARDS = [
  { key: "cpu", label: "CPU 使用率", unit: "%", digits: 1 },
  { key: "gpu", label: "集成显卡 (GPU)", unit: "%", digits: 1 },
  { key: "steal", label: "CPU Steal", unit: "%", digits: 2 },
  { key: "mem", label: "内存使用率", unit: "%", digits: 1 },
  { key: "load", label: "1 分钟负载", unit: "", digits: 2 },
  { key: "root", label: "根分区使用", unit: "%", digits: 1 }
];

// 下方 8 块图表面板（在超宽屏下自动平铺为 4 列 × 2 行）
const PANELS = [
  {
    title: "CPU 使用率趋势", sub: "total", unit: "%", min: 0, max: 100,
    metrics: [
      { name: "使用率", color: "#2f6feb", key: "cpu.total" },
      { name: "Steal (抢占)", color: "#ea8b1f", key: "cpu.steal" },
      { name: "iowait", color: "#dc2626", key: "cpu.iowait" }
    ]
  },
  {
    title: "内存使用率趋势", sub: "physical", unit: "%", min: 0, max: 100,
    metrics: [
      { name: "内存 %", color: "#8b5cf6", key: "mem.pct" },
      { name: "SWAP %", color: "#0ea5e9", key: "swap.pct" }
    ]
  },
  {
    title: "系统平均负载", sub: "loadavg", unit: "", min: 0,
    metrics: [
      { name: "1 分钟", color: "#2f6feb", key: "cpu.load1" }
    ]
  },
  {
    title: "磁盘 IO 吞吐", sub: "吞吐 (B/s)", unit: "B/s", min: 0,
    metrics: [
      { name: "读速率", color: "#16a34a", key: "disk.sda.read_bps" },
      { name: "写速率", color: "#ea8b1f", key: "disk.sda.write_bps" }
    ]
  },
  {
    title: "磁盘平均等待延迟 (await)", sub: "毫秒", unit: "ms", min: 0,
    metrics: [
      { name: "延迟", color: "#dc2626", key: "disk.sda.await_ms" }
    ]
  },
  {
    title: "网络吞吐", sub: "吞吐 (B/s)", unit: "B/s", min: 0,
    metrics: [
      { name: "下行 (Rx)", color: "#2f6feb", key: "net.eth0.rx_bps" },
      { name: "上行 (Tx)", color: "#0ea5e9", key: "net.eth0.tx_bps" }
    ]
  },
  {
    title: "GPU 显卡负载与核心频率", sub: "Radeon HD 8470D", unit: "%", min: 0,
    metrics: [
      { name: "占用率", color: "#8b5cf6", key: "gpu.usage_pct" },
      { name: "核心频率 (MHz)", color: "#0ea5e9", key: "gpu.freq_mhz" }
    ]
  },
  {
    title: "磁盘分区占用率", sub: "各挂载点", unit: "%", min: 0, max: 100,
    metrics: [
      { name: "根分区 (/)", color: "#2f6feb", key: "mount._root.pct" },
      { name: "数据 (/data 或 /var)", color: "#8b5cf6", key: "mount._var.pct" }
    ]
  }
];

function initFitScreenMode() {
  const btn = document.getElementById("fitScreenBtn");
  const label = document.getElementById("fitScreenLabel");
  const saved = localStorage.getItem("prism_hmd_fit_mode");
  const isFit = saved === null ? true : saved === "true"; // 默认开启一屏模式

  document.body.classList.toggle("fit-screen", isFit);
  btn.classList.toggle("active", isFit);
  label.textContent = isFit ? "一屏模式" : "自适应滚动";

  btn.onclick = () => {
    const cur = document.body.classList.toggle("fit-screen");
    btn.classList.toggle("active", cur);
    label.textContent = cur ? "一屏模式" : "自适应滚动";
    localStorage.setItem("prism_hmd_fit_mode", cur);
    redrawAll();
  };
}

function buildUI() {
  document.getElementById("ranges").innerHTML = Object.keys(RANGES)
    .map(k => `<button data-r="${k}" class="${k === currentRange ? 'on' : ''}">${k}</button>`)
    .join("");

  document.querySelectorAll("#ranges button").forEach(b => {
    b.onclick = () => {
      currentRange = b.dataset.r;
      document.querySelectorAll("#ranges button").forEach(x => x.classList.toggle("on", x.dataset.r === currentRange));
      refresh();
    };
  });

  document.getElementById("cards").innerHTML = CARDS.map(c => `
    <div class="card">
      <div class="k"><span>${c.label}</span></div>
      <div class="v" id="card-${c.key}">—</div>
      <div class="s" id="card-${c.key}-s"></div>
    </div>
  `).join("");

  document.getElementById("charts").innerHTML = PANELS.map((p, i) => `
    <div class="panel">
      <h2><span>${p.title}</span><em>${p.sub || ''}</em></h2>
      <div class="legend" id="lg-${i}"></div>
      <div class="cvs"><canvas id="cv-${i}"></canvas></div>
    </div>
  `).join("");

  PANELS.forEach((p, i) => {
    const cv = document.getElementById("cv-" + i);
    cv.addEventListener("mousemove", ev => {
      const rect = cv.getBoundingClientRect();
      const st = state[i];
      if (!st || !st.span) return;
      const padL = 40, padR = 8;
      const ratio = (ev.clientX - rect.left - padL) / (rect.width - padL - padR);
      const t = st.t0 + ratio * st.span;
      st.hoverT = t;
      draw(cv, st.lines, Object.assign({}, st.opts, { hoverT: t }));
      st.lines.forEach((l, j) => {
        let best = null, bd = Infinity;
        for (const pt of l.points) {
          const d = Math.abs(pt[0] - t);
          if (d < bd) { bd = d; best = pt; }
        }
        const el = document.getElementById(`lg-${i}-${j}`);
        if (el && best) el.textContent = fmtVal(best[1], p.unit);
      });
    });

    cv.addEventListener("mouseleave", () => {
      const st = state[i];
      if (!st) return;
      st.hoverT = null;
      draw(cv, st.lines, st.opts);
      st.lines.forEach((l, j) => {
        const el = document.getElementById(`lg-${i}-${j}`);
        const last = l.points.length ? l.points[l.points.length - 1][1] : null;
        if (el) el.textContent = fmtVal(last, p.unit);
      });
    });
  });
}

function draw(canvas, lines, opts) {
  const dpr = window.devicePixelRatio || 1;
  const box = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(10, box.width), h = Math.max(10, box.height);
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const padL = 40, padR = 8, padT = 6, padB = 18;
  const cw = w - padL - padR, ch = h - padT - padB;
  const all = lines.flatMap(l => l.points);

  if (!all.length) {
    g.fillStyle = "#9aa1ab";
    g.font = "11px sans-serif";
    g.textAlign = "center";
    g.fillText("无数据", w / 2, h / 2);
    return;
  }

  let t0 = Math.min(...all.map(p => p[0])), t1 = Math.max(...all.map(p => p[0]));
  if (t1 === t0) t1 = t0 + 1;

  let vmin = opts.min, vmax = opts.max;
  if (vmin === undefined) vmin = Math.min(...all.map(p => p[1]));
  if (vmax === undefined) vmax = Math.max(...all.map(p => p[1]));
  if (vmin === vmax) { vmax = vmin + 1; }
  const pad = (vmax - vmin) * 0.08;
  if (opts.min === undefined) vmin -= pad;
  if (opts.max === undefined) vmax += pad;

  g.strokeStyle = "#e4e6eb";
  g.lineWidth = 1;
  g.fillStyle = "#9aa1ab";
  g.font = "9.5px ui-monospace, monospace";
  g.textAlign = "right";

  for (let i = 0; i < 3; i++) {
    const y = padT + (ch / 2) * i;
    const v = vmax - ((vmax - vmin) / 2) * i;
    g.beginPath();
    g.moveTo(padL, y);
    g.lineTo(w - padR, y);
    g.stroke();
    g.fillText(fmtVal(v, opts.unit, 0), padL - 5, y + 3);
  }

  const xOf = t => padL + ((t - t0) / (t1 - t0)) * cw;
  const yOf = v => padT + ch - ((v - vmin) / (vmax - vmin)) * ch;

  lines.forEach(l => {
    if (l.points.length < 2) return;
    g.strokeStyle = l.color;
    g.lineWidth = 1.6;
    g.beginPath();
    let first = true;
    for (const [t, v] of l.points) {
      const x = xOf(t), y = yOf(v);
      if (first) { g.moveTo(x, y); first = false; }
      else { g.lineTo(x, y); }
    }
    g.stroke();
  });

  if (opts.hoverT !== null && opts.hoverT !== undefined) {
    const hx = Math.max(padL, Math.min(w - padR, xOf(opts.hoverT)));
    g.strokeStyle = "rgba(47, 111, 235, 0.4)";
    g.setLineDash([3, 3]);
    g.beginPath();
    g.moveTo(hx, padT);
    g.lineTo(hx, h - padB);
    g.stroke();
    g.setLineDash([]);
  }

  g.textAlign = "left";
  g.fillText(fmtTime(t0), padL, h - 3);
  g.textAlign = "right";
  g.fillText(fmtTime(t1), w - padR, h - 3);
}

function fmtVal(v, unit, digits) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  if (unit === "°C" && v <= 0) return "不可用 (驱动偏移)";
  if (unit === "B/s") return fmtBytes(v);
  if (unit === "ms") return v.toFixed(1) + "ms";
  const d = digits !== undefined ? digits : (unit === "%" ? 1 : 2);
  return v.toFixed(d) + (unit ? unit : "");
}

function fmtBytes(b) {
  if (!b || b <= 0) return "0 B/s";
  const u = ["B/s", "KB/s", "MB/s", "GB/s"];
  let i = 0, n = b;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(1) + " " + u[i];
}

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
}

let eventSource = null;

// 从快照中提取各指标的最新值（用于实时追加到曲线中）
function extractSnapshotValue(snap, key) {
  if (key === "cpu.total") return snap.cpu.total;
  if (key === "cpu.steal") return snap.cpu.steal;
  if (key === "cpu.iowait") return snap.cpu.iowait;
  if (key === "cpu.load1") return snap.cpu.load[0];
  if (key === "mem.pct") return snap.mem.pct;
  if (key === "swap.pct") return snap.swap.pct;
  if (key === "swap.in_bps") return snap.swap.in_bps;
  if (key === "swap.out_bps") return snap.swap.out_bps;
  if (key.startsWith("disk.") && key.endsWith(".read_bps")) {
    return snap.disks && snap.disks.length ? snap.disks[0].read_bps : 0;
  }
  if (key.startsWith("disk.") && key.endsWith(".write_bps")) {
    return snap.disks && snap.disks.length ? snap.disks[0].write_bps : 0;
  }
  if (key.startsWith("disk.") && key.endsWith(".await_ms")) {
    return snap.disks && snap.disks.length ? snap.disks[0].await_ms : 0;
  }
  if (key.startsWith("net.") && key.endsWith(".rx_bps")) {
    return snap.nets && snap.nets.length ? snap.nets[0].rx_bps : 0;
  }
  if (key.startsWith("net.") && key.endsWith(".tx_bps")) {
    return snap.nets && snap.nets.length ? snap.nets[0].tx_bps : 0;
  }
  if (key === "mount._root.pct") {
    const m = (snap.mounts || []).find(x => x.path === "/");
    return m ? m.pct : 0;
  }
  if (key === "mount._var.pct") {
    const m = (snap.mounts || []).find(x => x.path === "/data" || x.path === "/var" || x.path === "/home");
    return m ? m.pct : 0;
  }
  if (key === "gpu.usage_pct") {
    return snap.gpu ? snap.gpu.usage_pct : 0;
  }
  if (key === "gpu.freq_mhz") {
    return snap.gpu ? snap.gpu.freq_mhz : 0;
  }
  if (key === "gpu.temp_c") {
    return snap.gpu ? snap.gpu.temp_c : 0;
  }
  return 0;
}

// 接收 SSE 实时推送快照（每 2 秒一次）
function onRealtimeSnapshot(snap) {
  document.getElementById("sub").textContent = `${snap.host.hostname} · ${snap.host.os}`;

  // 1. 实时更新 6 张数字卡
  setCard("cpu", snap.cpu.total, "%", 1);
  const gpuUsage = snap.gpu ? snap.gpu.usage_pct : 0;
  setCard("gpu", gpuUsage, "%", 1);
  const gpuSub = document.getElementById("card-gpu-s");
  if (gpuSub && snap.gpu) {
    gpuSub.textContent = `${snap.gpu.freq_mhz.toFixed(0)} MHz · ${snap.gpu.temp_c > 0 ? snap.gpu.temp_c.toFixed(0) + '°C' : snap.gpu.model}`;
  }
  setCard("steal", snap.cpu.steal, "%", 2);
  setCard("mem", snap.mem.pct, "%", 1);
  setCard("load", snap.cpu.load[0], "", 2);
  const rootMount = (snap.mounts || []).find(m => m.path === "/") || { pct: 0 };
  setCard("root", rootMount.pct, "%", 1);

  // 2. 将最新数据点实时推送到 8 块图表面板（追加模式）
  const ts = snap.ts;
  const timeLimit = RANGES[currentRange] || 3600;

  PANELS.forEach((p, i) => {
    const st = state[i];
    if (!st || !st.lines) return;

    p.metrics.forEach((m, j) => {
      const val = extractSnapshotValue(snap, m.key);
      const line = st.lines[j];
      if (line) {
        line.points.push([ts, val]);
        // 剔除超出当前时间跨度窗口的老点位
        const oldestAllowed = ts - timeLimit;
        while (line.points.length > 2 && line.points[0][0] < oldestAllowed) {
          line.points.shift();
        }
      }
    });

    const all = st.lines.flatMap(l => l.points.map(q => q[0]));
    if (all.length) {
      st.t0 = Math.min(...all);
      st.span = Math.max(...all) - st.t0;
    }

    // 实时刷新图例中的当前值
    st.lines.forEach((l, j) => {
      const el = document.getElementById(`lg-${i}-${j}`);
      const last = l.points.length ? l.points[l.points.length - 1][1] : null;
      if (el && (!st.hoverT)) el.textContent = fmtVal(last, p.unit);
    });

    // 实时重绘该面板 Canvas
    const cv = document.getElementById("cv-" + i);
    if (cv) draw(cv, st.lines, st.opts);
  });

  const dot = document.getElementById("dot");
  const txt = document.getElementById("stateText");
  dot.classList.remove("err");
  txt.textContent = "实时连接中";
  document.getElementById("updated").textContent = "实时推送 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
}

// 建立 SSE 长连接
function initSSE() {
  if (eventSource) {
    eventSource.close();
  }
  const dot = document.getElementById("dot");
  const txt = document.getElementById("stateText");
  const livePill = document.getElementById("livePill");

  eventSource = new EventSource("/api/v1/stream");

  eventSource.onopen = () => {
    dot.classList.remove("err");
    txt.textContent = "实时连接中";
    livePill.textContent = "LIVE";
    livePill.style.background = "#dcfce7";
    livePill.style.color = "#15803d";
  };

  eventSource.onmessage = (e) => {
    try {
      const snap = JSON.parse(e.data);
      onRealtimeSnapshot(snap);
    } catch (err) {
      console.error("SSE 数据解析失败:", err);
    }
  };

  eventSource.onerror = () => {
    dot.classList.add("err");
    txt.textContent = "重连中...";
    livePill.textContent = "RETRY";
    livePill.style.background = "#fee2e2";
    livePill.style.color = "#b91c1c";
  };
}

// 历史底图加载（切换时间范围或初始化时执行）
async function refresh() {
  const dot = document.getElementById("dot");
  const txt = document.getElementById("stateText");

  try {
    const snap = await fetch("/api/v1/now").then(r => r.json());
    document.getElementById("sub").textContent = `${snap.host.hostname} · ${snap.host.os}`;

    setCard("cpu", snap.cpu.total, "%", 1);
    const gpuUsageInit = snap.gpu ? snap.gpu.usage_pct : 0;
    setCard("gpu", gpuUsageInit, "%", 1);
    const gpuSubInit = document.getElementById("card-gpu-s");
    if (gpuSubInit && snap.gpu) {
      gpuSubInit.textContent = `${snap.gpu.freq_mhz.toFixed(0)} MHz · ${snap.gpu.temp_c > 0 ? snap.gpu.temp_c.toFixed(0) + '°C' : snap.gpu.model}`;
    }
    setCard("steal", snap.cpu.steal, "%", 2);
    setCard("mem", snap.mem.pct, "%", 1);
    setCard("load", snap.cpu.load[0], "", 2);
    const rootMount = (snap.mounts || []).find(m => m.path === "/") || { pct: 0 };
    setCard("root", rootMount.pct, "%", 1);

    await Promise.all(PANELS.map(async (p, i) => {
      const lines = await Promise.all(p.metrics.map(async (m, j) => {
        let key = m.key;
        if (key.startsWith("disk.sda.") && snap.disks && snap.disks.length) {
          key = key.replace("disk.sda.", `disk.${snap.disks[0].dev}.`);
        }
        if (key.startsWith("net.eth0.") && snap.nets && snap.nets.length) {
          key = key.replace("net.eth0.", `net.${snap.nets[0].if}.`);
        }

        const res = await fetch(`/api/v1/history?metric=${key}&range=${currentRange}`).then(r => r.json()).catch(() => ({ points: [] }));
        const points = (res.points || []).map(pt => [pt.ts, pt.avg]);
        return {
          name: m.name,
          color: m.color,
          points: points
        };
      }));

      const all = lines.flatMap(l => l.points.map(q => q[0]));
      const t0 = all.length ? Math.min(...all) : 0;
      const t1 = all.length ? Math.max(...all) : 0;
      const st = {
        lines: lines,
        t0: t0,
        span: t1 - t0,
        opts: { unit: p.unit, min: p.min, max: p.max }
      };
      state[i] = st;

      document.getElementById("lg-" + i).innerHTML = lines.map((l, j) => {
        const last = l.points.length ? l.points[l.points.length - 1][1] : null;
        return `<span><i style="background:${l.color}"></i>${l.name} <b id="lg-${i}-${j}">${fmtVal(last, p.unit)}</b></span>`;
      }).join("");

      draw(document.getElementById("cv-" + i), lines, st.opts);
    }));

    dot.classList.remove("err");
    txt.textContent = "实时连接中";
    document.getElementById("updated").textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
  } catch (e) {
    dot.classList.add("err");
    txt.textContent = "连接异常：" + e.message;
  }
}

function setCard(key, val, unit, digits) {
  const el = document.getElementById("card-" + key);
  if (el) {
    el.innerHTML = val === null || val === undefined ? "—" :
      val.toFixed(digits) + (unit ? `<small>${unit}</small>` : "");
  }
}

function redrawAll() {
  setTimeout(() => {
    PANELS.forEach((p, i) => {
      const st = state[i];
      if (st) draw(document.getElementById("cv-" + i), st.lines, st.opts);
    });
  }, 60);
}

window.addEventListener("resize", redrawAll);

buildUI();
initFitScreenMode();
refresh().then(() => {
  initSSE();
});

// 后台 30 秒兜底同步一次整体历史刻度（防止偶发丢包时间漂移）
timer = setInterval(refresh, 30000);

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (eventSource) { eventSource.close(); eventSource = null; }
    clearInterval(timer);
    timer = null;
  } else {
    refresh().then(() => { initSSE(); });
    if (!timer) timer = setInterval(refresh, 30000);
  }
});
</script>
