name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -v -race ./...

      - name: Build binary test
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/prism-monitor ./cmd/prism-monitor
          /tmp/prism-monitor -v
          CGO_ENABLED=0 go build -trimpath -o /tmp/prism-hmd ./cmd/prism-hmd
